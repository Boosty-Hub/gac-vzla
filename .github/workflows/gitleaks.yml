name: gitleaks

# Escaneo de secretos en cada push y PR. Previene que credenciales
# (tokens, service keys, etc.) entren al repo — la causa raíz del hallazgo C4.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan:
    name: Detectar secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
