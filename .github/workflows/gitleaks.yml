name: gitleaks

# EN MANUAL A PROPÓSITO (2026-08-26). Ya no corre en cada push.
#
# Las 40 corridas entre el 2026-08-03 y el 2026-08-26 fallaron, todas, y ninguna llegó a
# escanear una línea: el job ni siquiera arrancaba. GitHub devolvía "The job was not started
# because recent account payments have failed or your spending limit needs to be increased".
# Es facturación de la cuenta, no algo que se arregle desde el repo — ningún cambio acá
# adentro hace que un job bloqueado por pago corra.
#
# El resultado era un mail de "Run failed" por cada push, sobre algo que nadie podía resolver
# leyendo el repo. Una alarma que suena siempre deja de ser una alarma, y encima tapa a las
# que sí importan.
#
# EL ESCANEO NO SE PERDIÓ, SE MUDÓ: ahora corre en `.githooks/pre-commit`, antes de que el
# commit exista. Ahí sirve más — el CI avisa cuando el secreto YA está en el historial y la
# única salida es rotar la credencial; el hook impide que entre.
#
# PARA VOLVER A DEJARLO AUTOMÁTICO, una vez resuelta la facturación: descomentar el bloque
# `push`/`pull_request` de abajo. El escaneo en sí quedó bien y mira el historial completo.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

jobs:
  scan:
    name: Detectar secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Sin esto el checkout trae un solo commit y el escaneo del historial no ve nada:
          # daría verde por no tener qué mirar, que es peor que fallar.
          fetch-depth: 0
      - name: Instalar y correr gitleaks
        run: |
          VERSION=8.18.4
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          # Escanea el HISTORIAL, no sólo los archivos de hoy. Con `--no-git` un secreto
          # commiteado y después borrado del archivo daba verde — así pasó desapercibido el
          # access_token de Kommo del commit 1f91b92 durante cuatro meses.
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
