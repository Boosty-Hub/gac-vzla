# Configuración de gitleaks (escaneo de secretos).
[extend]
useDefault = true

[allowlist]
description = "Valores públicos/ya-revocados que no deben marcar el escaneo."
regexes = [
  # Token de Management API sbp_ ya REVOCADO (rotado el 2026-07-03). Aparece en
  # docs/config históricos; cualquier secreto NUEVO/distinto sí se detecta.
  '''sbp_b715f486726674624577159f19c827fc1a9d7d4c''',
  # Anon/publishable key de Supabase (payload role:anon de este proyecto). Es
  # PÚBLICA por diseño: va en el frontend. La seguridad recae en RLS.
  '''eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzYnVxaXpuZGR2eGN3dnBuYnhtIiwicm9sZSI6ImFub24i''',
  # Nueva publishable key (sb_publishable_...): también pública por diseño.
  '''sb_publishable_7kE-XLp_jL_fPq2XqVOSMg_IejPqbdy''',
  # Clave del widget de soporte de Boosty (src/components/BoostySupport.tsx).
  # El prefijo `pk_` es de publishable, y se comprobó: viaja adentro del bundle
  # compilado, así que cualquiera la lee desde el navegador. Marcarla sería pedir
  # que se esconda algo que por diseño se publica.
  '''bw_pk_887c9a608806a32b74f2f7dc2531e5b2''',
]
